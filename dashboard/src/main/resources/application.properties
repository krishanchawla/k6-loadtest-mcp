spring.application.name=loadtest-dashboard
server.port=${DASHBOARD_PORT:8080}

# H2, file-backed -- mirrors the Node side's convention of state living under a stable per-user/
# per-host directory rather than inside the build output (see src/lib/home.ts on the Node side).
spring.datasource.url=jdbc:h2:file:${DASHBOARD_DATA_DIR:${user.home}/.k6-loadtest-mcp/dashboard}/dashboarddb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Bearer token guarding POST /api/runs (ApiTokenFilter). Must match K6_LOADTEST_DASHBOARD_TOKEN on
# the MCP side. Left blank by default (not startup-fatal) so the app still comes up and serves the
# web pages before this is set -- the ingest endpoint just refuses everything (503) until it is.
# No hardcoded fallback token here on purpose -- a default baked into the jar would be a known,
# guessable credential the moment this project is public.
dashboard.api-token=${DASHBOARD_API_TOKEN:}

# HTTP Basic credentials guarding every page except /api/**, UNLESS left unset -- see SecurityConfig's
# javadoc: that's the deliberate "public demo" posture, not a fallback-open bug. No hardcoded default
# password either way, for the same reason as the token above.
dashboard.basic-auth.username=${DASHBOARD_BASIC_AUTH_USER:admin}
dashboard.basic-auth.password=${DASHBOARD_BASIC_AUTH_PASS:}

# Externally visible base URL, used to build the shareable links returned from POST /api/runs (e.g.
# "https://myvps.example.com/loadtest-dashboard" if nginx proxies a path, or a dedicated subdomain
# with no path prefix). This must be set explicitly rather than inferred from request headers --
# same "explicit over guessed" philosophy as the MCP side's allowedHosts/dashboardUrl config.
dashboard.public-base-url=${DASHBOARD_PUBLIC_BASE_URL:http://localhost:${server.port}}

# Public-demo-mode only (RunIngestController#assertAllowedTarget). Unset -- the self-host default --
# means any baseUrl is accepted, unchanged from before this existed. Set to a host[:port] (e.g.
# "your-vps.example.com:4000") to reject publish_report calls against anything else.
dashboard.demo-target-host=${DASHBOARD_DEMO_TARGET_HOST:}

# Public-demo-mode only (RunRetentionScheduler). 0/unset -- the self-host default -- disables pruning;
# runs are kept forever, unchanged from before this existed. Set to a positive number of days to
# auto-delete older runs on a daily schedule.
dashboard.retention-days=${DASHBOARD_RETENTION_DAYS:0}
