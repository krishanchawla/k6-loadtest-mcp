<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Sticky, blurred header with a gradient hairline -- this project's half of the shared brand
     signature with ci-triage-dashboard's header (same treatment, each app's own --accent; see
     dashboard.css's header comment). The brand mark keeps this project's original "ascending
     bars" motif (ramping load), just elevated into the same rounded-square gradient badge
     treatment ci-triage-dashboard's mark uses. -->
<header th:fragment="header" class="site-header">
  <div class="inner">
    <div class="brand-block">
      <a th:href="@{/}" class="brand">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" class="brand-mark">
          <defs>
            <linearGradient id="brand-grad-header" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
              <stop offset="0%" style="stop-color:var(--accent)"/>
              <stop offset="100%" style="stop-color:var(--accent-strong)"/>
            </linearGradient>
          </defs>
          <rect width="24" height="24" rx="7" fill="url(#brand-grad-header)"/>
          <rect x="6" y="14" width="3.2" height="5" rx="1.6" fill="#fff" opacity="0.6"/>
          <rect x="10.4" y="9" width="3.2" height="10" rx="1.6" fill="#fff" opacity="0.85"/>
          <rect x="14.8" y="4" width="3.2" height="15" rx="1.6" fill="#fff"/>
        </svg>
        <span>loadtest-dashboard</span>
      </a>
      <span class="tagline">reports published by k6-loadtest-mcp</span>
    </div>
    <div class="header-actions">
      <button id="theme-toggle-btn" class="theme-toggle" type="button" title="Toggle light/dark theme">
        <svg class="icon-sun" width="14" height="14" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="3.2" stroke="currentColor" stroke-width="1.4"/>
          <path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3.05 3.05l1.13 1.13M11.82 11.82l1.13 1.13M3.05 12.95l1.13-1.13M11.82 4.18l1.13-1.13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <svg class="icon-moon" width="14" height="14" viewBox="0 0 16 16" fill="none" style="display:none">
          <path d="M13.5 9.5A5.5 5.5 0 1 1 6.5 2.5a4.3 4.3 0 0 0 7 7z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<footer th:fragment="footer" class="site-footer">
  <div class="site-footer-inner">
    <a href="https://krishanchawla.com/projects" target="_blank" rel="noopener">krishanchawla.com/projects</a>
  </div>
</footer>
</body>
</html>
